configuration:
  adapter_direct_enabled:
    name: "Adapter direct enabled"
    description: "Enable adapter-direct routing; rejects an external proxy endpoint and overrides transport, network and address."
  adapter_direct_protocol:
    name: "Adapter direct protocol"
    description: "Select ENH or ENS for adapter-direct routing. Omitted values use ENH; an old proxy profile can supply the selector until explicitly persisted."
  adapter_direct_address:
    name: "Adapter direct address"
    description: "Adapter endpoint or serial device path. Trim whitespace and the scheme; a serial protocol prefix must agree with the selector."
  proxy_listen_addr:
    name: "Proxy listen addr"
    description: "Gateway-integrated proxy listener address. Empty disables it; a configured listener requires gateway flag support."
  transport:
    name: "Transport"
    description: "Transport input before adapter-direct or proxy overrides."
  network:
    name: "Network"
    description: "Network input before adapter-direct or proxy overrides."
  address:
    name: "Address"
    description: "Address input before adapter-direct or proxy overrides."
  proxy_profile:
    name: "Proxy profile"
    description: "External proxy profile, disabled, ENH or ENS. Selects effective transport and address; legacy adapter-direct configuration is migrated in memory."
  proxy_endpoint:
    name: "Proxy endpoint"
    description: "External proxy endpoint, required for an active external proxy profile and forbidden with adapter-direct mode."
  host:
    name: "Host"
    description: "Host label used only in logged HTTP URLs. Does not select the listener bind address."
  http_port:
    name: "Http port"
    description: "HTTP listener port. Ingress is available on the declared Ingress port only."
  graphql_path:
    name: "Graphql path"
    description: "GraphQL route. Adds a leading slash and derives the default subscription route from it."
  subscription_path:
    name: "Subscription path"
    description: "Subscription route. Adds a leading slash; the default route follows a changed GraphQL route."
  mcp_path:
    name: "Mcp path"
    description: "MCP HTTP route; the wrapper adds a leading slash when absent."
  mdns:
    name: "Mdns"
    description: "Enable or disable gateway mDNS advertisement."
  mdns_instance:
    name: "Mdns instance"
    description: "Gateway mDNS instance label."
  broadcast:
    name: "Broadcast"
    description: "Enable or disable gateway broadcast handling."
  source_addr:
    name: "Source addr"
    description: "Auto delegates source selection to the gateway. Explicit values use the ebusd-compatible source flag for that transport, otherwise require validate-only startup override support."
  scan_request_timeout:
    name: "Scan request timeout"
    description: "Gateway scan request timeout; empty values use 400ms."
  read_timeout:
    name: "Read timeout"
    description: "Gateway read timeout."
  write_timeout:
    name: "Write timeout"
    description: "Gateway write timeout."
  dial_timeout:
    name: "Dial timeout"
    description: "Gateway dial timeout."
  observe_first_enabled:
    name: "Observe first enabled"
    description: "Gateway observe-first switch; missing values use true."
  passive_state_direct_apply:
    name: "Passive state direct apply"
    description: "Gateway passive state direct-apply switch; missing values use true."
  passive_config_direct_apply:
    name: "Passive config direct apply"
    description: "Gateway passive configuration direct-apply switch; missing values use false."
  external_write_policy:
    name: "External write policy"
    description: "Gateway external write policy; missing values use record_only."
  enable_static_seed_table:
    name: "Enable static seed table"
    description: "Request the static seed table. Passed only when supported; an unsupported enabled request logs a warning."
  v8_classifier_mode:
    name: "V8 classifier mode"
    description: "Classifier mode, off, shadow or enforce; exported through the gateway environment. Missing values use enforce."
  eebus_enabled:
    name: "Eebus enabled"
    description: "Enable the eeBUS argument bundle after validation and gateway support checks; pairing remains closed."
  eebus_listen_port:
    name: "Eebus listen port"
    description: "eeBUS listener port, validated from 1 through 65535 when enabled."
  eebus_interface:
    name: "Eebus interface"
    description: "One explicit interface; validated and used for the gateway interface argument and stable machine identity derivation."
  eebus_subnets:
    name: "Eebus subnets"
    description: "Nonempty prefix list, trimmed before the enabled eeBUS bundle is emitted."
  eebus_discovery_enabled:
    name: "Eebus discovery enabled"
    description: "Boolean discovery control emitted with the enabled eeBUS bundle."
  eebus_remote_ski_allowlist:
    name: "Eebus remote ski allowlist"
    description: "Optional comma-separated remote SKI allowlist; every entry must be 40 hexadecimal characters."
  modbus_tcp_enabled:
    name: "Modbus tcp enabled"
    description: "Enable validated Modbus TCP configuration. Select the scalar endpoint file or the endpoints document; disabled configuration emits no Modbus arguments."
  modbus_tcp_endpoint:
    name: "Modbus tcp endpoint"
    description: "Scalar Modbus TCP endpoint. Validated and written to a protected endpoint file; the gateway receives the file path only."
  modbus_tcp_dial_timeout:
    name: "Modbus tcp dial timeout"
    description: "Scalar Modbus dial timeout. Validated in the helper; a nonempty endpoint list requires this scalar to retain its default."
  modbus_tcp_endpoints:
    name: Modbus TCP endpoints
    description: >-
      Up to eight read-only Modbus TCP endpoints, one driver instance each. Leave
      the list empty to keep the single endpoint option. A non-empty list cannot
      be combined with the single endpoint option or a changed dial timeout, and
      needs Modbus TCP enabled. A change takes effect at the next add-on start.
    fields:
      label:
        name: Label
        description: >-
          Public identifier, unique in the list: lowercase letters, digits and
          single hyphens, starting with a letter, 1 to 32 characters. It becomes
          part of the driver ID, so never put an address, serial number or site
          detail in it. The label default keeps the single endpoint identity.
      family:
        name: Family
        description: >-
          The device family this endpoint is read as: sunspec,
          huawei.smartlogger, huawei.emma or huawei.sdongle. No other family is
          tried. A Huawei family is accepted as configuration only and stays
          withheld until its own contract admits it.
      endpoint:
        name: Endpoint
        description: >-
          tcp://host:port with a host name or IP address and port 1 to 65535. No
          credentials, path or query. It is hidden here and never appears in
          logs or process arguments.
      dial_timeout:
        name: Dial timeout
        description: Connection timeout in ms or s, from 100ms through 30s. Default 5s.
      units:
        name: Routed units
        description: >-
          Optional allowlist of 1 to 32 distinct unit numbers from 1 to 247. It
          only narrows what the family reports. For sunspec leave it out or use 1.
      pacing_gap_ms:
        name: Gap between requests (ms)
        description: Idle time between two transactions, 50 to 2000. Default 200.
      pacing_settle_ms:
        name: Settle after connect (ms)
        description: Wait after each connect before the first request, 0 to 10000. Default 1000.
      pacing_cycle_s:
        name: Cycle interval (s)
        description: Time between acquisition cycles, 15 to 3600. Default 30 (15 for sunspec).
      pacing_backoff_floor_s:
        name: Reconnect delay start (s)
        description: First reconnect delay, 1 to 300, doubled after each failure. Default 5.
      pacing_backoff_ceiling_s:
        name: Reconnect delay limit (s)
        description: Largest reconnect delay, 5 to 3600, not below the start. Default 300.
  m2m_graphql_enabled:
    name: "M2m graphql enabled"
    description: "Enable the dedicated TLS GraphQL listener and validate its fixed TLS files. The optional Portal client bundle enables additional Portal arguments only when complete."
  m2m_graphql_server_name:
    name: "M2m graphql server name"
    description: "TLS server identity, validated before startup; also supplied to the optional Portal client."
  m2m_graphql_asset_ref:
    name: "M2m graphql asset ref"
    description: "Opaque allowed asset reference; also supplied to the optional Portal client."
