name: build-addon

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/project-helianthus/helianthus-ha-addon
  OCI_SOURCE: https://github.com/Project-Helianthus/helianthus-ha-addon
  OCI_DESCRIPTION: Helianthus Home Assistant add-on
  OCI_LICENSE: AGPL-3.0-or-later

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
          - platform: linux/arm64
            arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base:3.20
          - platform: linux/arm/v7
            arch: armv7
            base: ghcr.io/home-assistant/armv7-base:3.20
          - platform: linux/arm/v6
            arch: armhf
            base: ghcr.io/home-assistant/armhf-base:3.20
          - platform: linux/386
            arch: i386
            base: ghcr.io/home-assistant/i386-base:3.20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        run: |
          set -euo pipefail
          echo "version=$(jq -r '.version' helianthus/config.json)" >> "$GITHUB_OUTPUT"

      - name: Verify helianthus-vrc-explorer release tag
        run: |
          set -euo pipefail
          remote_url="https://github.com/Project-Helianthus/helianthus-vrc-explorer.git"
          if [ -n "${{ secrets.REPO_READ_TOKEN }}" ]; then
            remote_url="https://x-access-token:${{ secrets.REPO_READ_TOKEN }}@github.com/Project-Helianthus/helianthus-vrc-explorer.git"
          fi
          ref="$(git ls-remote "${remote_url}" refs/tags/v0.6.1 | awk '{print $1}')"
          if [ -z "${ref}" ]; then
            echo "failed to resolve helianthus-vrc-explorer v0.6.1 tag" >&2
            exit 1
          fi
          echo "Resolved helianthus-vrc-explorer v0.6.1 to ${ref}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: ./helianthus
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
            org.opencontainers.image.description=${{ env.OCI_DESCRIPTION }}
            org.opencontainers.image.licenses=${{ env.OCI_LICENSE }}
          build-args: |
            BUILD_VERSION=${{ steps.addon.outputs.version }}
            EBUSGATEWAY_VERSION=b223acf12162f8fee470ac337e1207a9382bae0e
            VRCEXPLORER_VERSION=v0.6.1
            BUILD_FROM=${{ matrix.base }}
          secrets: |
            github_token=${{ secrets.REPO_READ_TOKEN }}

  manifest:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        run: |
          set -euo pipefail
          echo "version=$(jq -r '.version' helianthus/config.json)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable candidate index
        env:
          CANDIDATE: candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Every architecture must be published by this attempt; partial retries are unsupported.
          for arch in amd64 aarch64 armv7 armhf i386; do
            if ! docker buildx imagetools inspect "${IMAGE_NAME}:${CANDIDATE}-${arch}" > /dev/null; then
              echo "Missing current-attempt image for ${arch}; use Re-run all jobs, not Re-run failed jobs." >&2
              exit 1
            fi
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${OCI_SOURCE}" \
            --annotation "index:org.opencontainers.image.description=${OCI_DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.licenses=${OCI_LICENSE}" \
            -t "${IMAGE_NAME}:${CANDIDATE}" \
            "${IMAGE_NAME}:${CANDIDATE}-amd64" \
            "${IMAGE_NAME}:${CANDIDATE}-aarch64" \
            "${IMAGE_NAME}:${CANDIDATE}-armv7" \
            "${IMAGE_NAME}:${CANDIDATE}-armhf" \
            "${IMAGE_NAME}:${CANDIDATE}-i386"
          docker buildx imagetools inspect "${IMAGE_NAME}:${CANDIDATE}" --format '{{json .Manifest}}' > descriptor.json
          jq --arg version '${{ steps.addon.outputs.version }}' \
            --arg image "$IMAGE_NAME" --arg candidate "$CANDIDATE" \
            '{version: $version, image: $image, candidate: $candidate, digest: .digest}' descriptor.json > candidate.json
          echo "Candidate ${CANDIDATE}: $(jq -r .digest candidate.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record candidate digest
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: candidate.json

      - name: Verify GHCR package is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/orgs/${{ github.repository_owner }}/packages/container/helianthus-ha-addon" --jq '.visibility')"
          if [ "${visibility}" != "public" ]; then
            echo "GHCR package visibility is '${visibility}'. Home Assistant Supervisor needs anonymous pull access."
            echo "Open https://github.com/orgs/${{ github.repository_owner }}/packages/container/package/helianthus-ha-addon and set visibility to public."
            exit 1
          fi

  release:
    permissions:
      contents: read
      packages: write
      actions: read
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: addon-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select successful main candidate for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=main&event=push&status=success&head_sha=${commit}&per_page=100" > runs.json
          run="$(jq -er --arg commit "$commit" '[.workflow_runs[] | select(.head_sha == $commit)] | first | .id // error("no successful main candidate")' runs.json)"
          attempt="$(jq -er --argjson run "$run" '.workflow_runs[] | select(.id == $run) | .run_attempt' runs.json)"
          gh run download "$run" --name "release-candidate-${attempt}" --dir candidate
          python3 scripts/release_promotion_plan.py --publish candidate/candidate.json --release-tag "$GITHUB_REF_NAME" --candidate "candidate-${run}-${attempt}"
