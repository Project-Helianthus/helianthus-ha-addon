name: Add-on option inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test requirements
        run: python3 -m pip install -r requirements-ci.txt
      - name: Check complete option inventory
        run: python3 scripts/check_addon_options.py
      - name: Exercise independent inventory mutations
        run: python3 -m pytest -q tests/test_addon_options.py
