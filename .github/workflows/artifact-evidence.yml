name: Artifact evidence synthetic tests
on:
  pull_request:
    paths:
      - scripts/compare_artifact_evidence.py
      - tests/test_artifact_evidence.py
      - docs/artifact-evidence.md
      - .github/workflows/artifact-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline synthetic unit tests
        run: python3 -m unittest discover -s tests -p test_artifact_evidence.py -v
      - name: Run synthetic self-test
        run: python3 scripts/compare_artifact_evidence.py --self-test
