name: pr-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            found=1
            python3 -m json.tool "${file}" > /dev/null
            echo "OK: ${file}"
          done < <(git ls-files '*.json')
          if [ "${found}" -eq 0 ]; then
            echo "No JSON files found."
          fi

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            found=1
            bash -n "${file}"
            echo "OK: ${file}"
          done < <(git ls-files '*.sh')
          if [ "${found}" -eq 0 ]; then
            echo "No shell files found."
          fi

      - name: Enforce terminology
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIwiE 'm[a]ster|s[l]ave'; then
            echo "Found legacy terminology in tracked files."
            exit 1
          fi

      - name: Validate smoke runbook structure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_smoke_docs.py

      - name: Validate eeBUS HA network proof contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_eebus_ha_network_proof.py --self-test
          python3 scripts/check_eebus_ha_network_proof.py --artifact scripts/fixtures/eebus_ha_network_proof_contract_pass.json --mode contract

      - name: Validate source address wrapper migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_source_addr_wrapper.py

      - name: Validate persistent eeBUS wrapper wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pytest
          python3 scripts/check_eebus_wrapper.py
          python3 -m pytest tests/test_eebus_admin_wrapper.py -q

      - name: Validate runtime-state wrapper migration
        shell: bash
        run: |
          set -euo pipefail
          # Sandbox the wrapper into a temp dir so CI never touches the
          # runner's /data/ (a real /data/instance_guid would trip AD09a;
          # case-3 fall-through would create /data/runtime_state.json on
          # the runner). Codex P2 follow-up on PR #127.
          tmp_state_dir=$(mktemp -d)
          trap 'rm -rf "${tmp_state_dir}"' EXIT
          HELIANTHUS_RUNTIME_STATE_PATH="${tmp_state_dir}/runtime_state.json" \
          HELIANTHUS_LEGACY_INSTANCE_GUID_PATH="${tmp_state_dir}/instance_guid" \
          HELIANTHUS_MIGRATION_MARKER_PATH="${tmp_state_dir}/.helianthus_migration_required" \
            python3 scripts/check_runtime_state_wrapper.py
          # Confirm the case-3 bootstrap landed in the temp dir, not /data.
          test -f "${tmp_state_dir}/runtime_state.json"
          test ! -e /data/runtime_state.json || {
            echo "FAIL: wrapper wrote /data/runtime_state.json on the CI runner"
            exit 1
          }

      - name: Run runtime-state wrapper contract tests
        shell: bash
        run: |
          set -euo pipefail
          # The contract test suite (covers all 5 AD09b read-precedence
          # cases, AD09a halt details, AD25/AD26/AD27 invariants, and the
          # case-3 bootstrap persistence path) — each test uses tmp_path
          # fixtures + explicit HELIANTHUS_* env-overrides, so it never
          # touches the runner's /data/.
          python3 -m pip install --quiet --user pytest
          python3 -m pytest tests/test_runtime_state_wrapper_red.py tests/test_gateway_parity_gate.py -q

      - name: Validate gateway parity gate artifact
        shell: bash
        run: |
          set -euo pipefail
          gateway_version="$(sed -n 's/^ARG EBUSGATEWAY_VERSION=//p' helianthus/Dockerfile)"
          python3 scripts/check_gateway_parity_gate.py --artifact scripts/fixtures/gateway_parity_artifact_pass.json --source-ref "${gateway_version}" --verify-github

      - name: Validate Fronius-to-Home-Assistant rollout contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest tests/test_fronius_ha_rollout.py tests/test_m2m_runtime_wiring.py -q
          python3 scripts/check_fronius_ha_rollout.py \
            --artifact scripts/fixtures/fronius_ha_rollout_contract_pass.json \
            --mode contract

      - name: Validate rollout guardrails
        shell: bash
        run: |
          set -euo pipefail
          gateway_version="$(sed -n 's/^ARG EBUSGATEWAY_VERSION=//p' helianthus/Dockerfile)"
          python3 scripts/check_rollout_guardrails.py --guardrail helianthus/rollout_guardrails.json --artifact scripts/fixtures/gateway_parity_artifact_pass.json --source-ref "${gateway_version}"

      - name: Run post-parity enablement tasks
        shell: bash
        run: |
          set -euo pipefail
          gateway_version="$(sed -n 's/^ARG EBUSGATEWAY_VERSION=//p' helianthus/Dockerfile)"
          python3 scripts/run_post_parity_enablement.py --guardrail helianthus/rollout_guardrails.json --artifact scripts/fixtures/gateway_parity_artifact_pass.json --source-ref "${gateway_version}" --addon-config helianthus/config.json --smoke-runbook SMOKE_RUNBOOK.md

      - name: Enforce Markdown private IPv4 placeholders
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_markdown_private_ips.py --self-test
          python3 scripts/check_markdown_private_ips.py
